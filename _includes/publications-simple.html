<article class="publication-row">
  {% if post.arch %}
    <div class="publication-row__figure">
      <img src="{% if post.arch contains '://' %}{{ post.arch }}{% else %}{{ post.arch | relative_url }}{% endif %}" alt="Diagram for {{ post.title | escape }}" loading="lazy" width="320" height="180" />
    </div>
  {% endif %}
  <div class="publication-row__body">
    <p class="publication-card__venue">{{ post.pubinfo }}</p>
    <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
    <p class="publication-card__authors">{{ post.authors }}</p>
    <div class="publication-card__links">
      {% if post.pdf %}<a href="{{ post.pdf }}" target="_blank" rel="noopener noreferrer">Paper</a>{% endif %}
      {% if post.code %}<a href="{{ post.code }}" target="_blank" rel="noopener noreferrer">Code</a>{% endif %}
      <a href="{{ post.url | relative_url }}">Details</a>
    </div>
  </div>
</article>
